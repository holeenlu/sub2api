# Combine with the existing backend Compose on one host, or run alone on A.
services:
  vendor-portal:
    image: ${VENDOR_PORTAL_IMAGE:-sub2api-vendor:local}
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND_HOST:-127.0.0.1}:${PORTAL_PORT:-8081}:8080"
    environment:
      PORTAL_PUBLIC_ORIGIN: ${PORTAL_PUBLIC_ORIGIN:?Set the public supplier origin}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:?Set the existing operations backend origin}
      PORTAL_TRUSTED_PROXY_CIDRS: ${PORTAL_TRUSTED_PROXY_CIDRS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
