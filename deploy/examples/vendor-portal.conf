# Example only; no deployment performed. Replace the reserved example hostname,
# certificate paths, static root and backend address with reviewed local values.
# Match vendor_portal_origin exactly. Build with VITE_VENDOR_PORTAL=true and
# same-origin /api/v1 (no cross-origin VITE_API_BASE_URL). Upgrade all backend
# instances before enabling vendor_console_enabled. Include in an nginx http block.
server {
    listen 443 ssl;
    server_name supplier.example.invalid;
    ssl_certificate /etc/nginx/tls/supplier/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/supplier/privkey.pem;
    root /srv/sub2api/vendor-frontend;
    index index.html;
    if ($host != supplier.example.invalid) { return 444; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # One backend owns the supplier-host method/path allowlist, live role,
    # direct-owner/child scope and step-up checks. This includes the scoped
    # super-admin workbench; unfiltered customer/admin APIs remain forbidden.
    # Preserve Host: VendorOrigin also protects GETs without an Origin header.
    # No wildcard credentialed CORS or cross-origin token forwarding.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location /api/ { return 404; }
    location /admin { return 404; }
    location /register { return 404; }
    location /assets/ { try_files $uri =404; expires 1h; }
    location = /index.html { add_header Cache-Control 'no-store'; }
    location / { try_files $uri $uri/ /index.html; }
}
