<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">KDAN</title>
  <desc id="desc">A geometric K monogram whose arms fan out to two endpoint nodes on a connection rail.</desc>
  <defs>
    <linearGradient id="kdan-bg" x1="72" y1="44" x2="442" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142B56"/>
      <stop offset=".52" stop-color="#0A1A39"/>
      <stop offset="1" stop-color="#061127"/>
    </linearGradient>
    <radialGradient id="kdan-ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 92) rotate(51) scale(342 382)">
      <stop stop-color="#3E68B0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3E68B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kdan-brand" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79F4BD"/>
      <stop offset=".48" stop-color="#39D9E7"/>
      <stop offset="1" stop-color="#3875F6"/>
    </linearGradient>
    <filter id="kdan-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy=".55" stdDeviation=".65" flood-color="#020817" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#kdan-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#kdan-ambient)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#A5BFFF" stroke-opacity=".16" stroke-width="1.5"/>

  <!-- 24-unit grid, same placement as the other brand marks. A monoline "K":
       stem plus two arms that fan out to endpoint nodes sitting on a faint
       vertical rail (the API/connection motif). -->
  <g transform="translate(52 52) scale(17)" fill="none" stroke="url(#kdan-brand)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" filter="url(#kdan-shadow)">
    <!-- endpoint rail -->
    <path d="M16.8 6.2v11.6" stroke-width="1.9" stroke-opacity=".3"/>
    <!-- K stem -->
    <path d="M7.2 5v14"/>
    <!-- K arms routing out to the endpoints -->
    <path d="M7.2 12 16.8 6.2"/>
    <path d="M7.2 12 16.8 17.8"/>
    <!-- endpoint nodes -->
    <circle cx="16.8" cy="6.2" r="1.65" fill="url(#kdan-brand)" stroke="none"/>
    <circle cx="16.8" cy="17.8" r="1.65" fill="url(#kdan-brand)" stroke="none"/>
  </g>
</svg>
