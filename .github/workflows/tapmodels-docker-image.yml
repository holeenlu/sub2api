name: TapModels · Docker 映像與 Release

# main 更新建置分支/SHA 映像；數字版本 tag 另建版本映像和 GitHub Release。
# 僅正式版本更新 latest，預發布維持獨立版本標籤。

on:
  push:
    branches: [main]
    # tag 不加 v 前綴（例如 1.0.0）：上游的 release.yml 只監聽 v*，這樣它永遠不會在本 repo 被觸發，
    # 也就不必停用它（未登記的工作流程無法用 API 停用）。後端 compareVersions 接受沒有 v 的版號。
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 逗號分隔，例如 linux/amd64,linux/arm64
        required: false
        default: linux/amd64
        type: string
      push:
        description: 是否推送到 GHCR
        required: false
        default: true
        type: boolean

concurrency:
  group: tapmodels-docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.repository == 'erwinlin/TapModels'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta-vars.outputs.version }}
      image_tag: ${{ steps.release-tag.outputs.image_tag }}
      prerelease: ${{ steps.release-tag.outputs.prerelease }}
      stable: ${{ steps.release-tag.outputs.stable }}
      pushed: ${{ steps.meta-vars.outputs.push }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 校驗發版標籤
        id: release-tag
        shell: bash
        run: python3 deploy/release_metadata.py "$GITHUB_REF" >> "$GITHUB_OUTPUT"

      - name: 計算版本與映像名稱
        id: meta-vars
        shell: bash
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_PUSH: ${{ inputs.push }}
          TAG_VERSION: ${{ steps.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$TAG_VERSION"
          else
            LAST="$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || echo 0.0.0)"
            VERSION="${LAST#v}-main.$(git rev-parse --short=7 HEAD)"
          fi

          PLATFORMS="${INPUT_PLATFORMS:-linux/amd64}"
          PUSH=true
          if [ "$INPUT_PUSH" = "false" ]; then PUSH=false; fi

          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "platforms=$PLATFORMS"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: 計算上游版本
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          # >>> 上游版本推導：build 與 release job 各有一份，必須逐字一致，改一邊要同步改另一邊 <<<
          # 上游版本 = 本分支掛靠的那個上游 commit 最近的 v* tag。
          # 由 merge-base + describe 推導已納入的上游版本，不依賴合併提交標題。
          # 也不能讀 backend/cmd/server/VERSION：上游是在發版流程裡才回寫那個檔
          # （chore: sync VERSION to X [skip ci]），vX.Y.Z 這個 tag 上的檔案內容永遠是
          # 「上一版」（v0.2.1 上寫著 0.2.0）——只在推導失敗時當退路。
          git remote get-url upstream >/dev/null 2>&1 \
            || git remote add upstream 'https://github.com/Wei-Shaw/sub2api.git'
          git fetch --quiet upstream --tags
          UPSTREAM_BASE="$(git merge-base HEAD upstream/main 2>/dev/null || true)"
          UPSTREAM_TAG=""
          if [ -n "$UPSTREAM_BASE" ]; then
            UPSTREAM_TAG="$(git describe --tags --match 'v*' --abbrev=0 "$UPSTREAM_BASE" 2>/dev/null || true)"
          fi
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::warning::無法由 upstream/main 推導上游版本，退回 backend/cmd/server/VERSION"
            UPSTREAM_TAG="v$(tr -d ' \n\r' < backend/cmd/server/VERSION)"
          fi
          # <<< 上游版本推導結束 >>>
          echo "upstream_version=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: contains(steps.meta-vars.outputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.meta-vars.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.release-tag.outputs.image_tag }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ steps.release-tag.outputs.stable == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.meta-vars.outputs.platforms }}
          push: ${{ steps.meta-vars.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            COMMIT=${{ steps.meta-vars.outputs.commit }}
            DATE=${{ steps.meta-vars.outputs.date }}
            UPSTREAM_VERSION=${{ steps.upstream.outputs.upstream_version }}
            ZH_TW=true
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 摘要
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### TapModels 映像"
            echo
            echo "版本字串：\`${{ steps.meta-vars.outputs.version }}\`"
            echo
            echo "推送：\`${{ steps.meta-vars.outputs.push }}\`，平台：\`${{ steps.meta-vars.outputs.platforms }}\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 產生 release notes 並發布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          STABLE: ${{ needs.build.outputs.stable }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # >>> 上游版本推導：build 與 release job 各有一份，必須逐字一致，改一邊要同步改另一邊 <<<
          # 上游版本 = 本分支掛靠的那個上游 commit 最近的 v* tag。
          # 由 merge-base + describe 推導已納入的上游版本，不依賴合併提交標題。
          # 也不能讀 backend/cmd/server/VERSION：上游是在發版流程裡才回寫那個檔
          # （chore: sync VERSION to X [skip ci]），vX.Y.Z 這個 tag 上的檔案內容永遠是
          # 「上一版」（v0.2.1 上寫著 0.2.0）——只在推導失敗時當退路。
          git remote get-url upstream >/dev/null 2>&1 \
            || git remote add upstream 'https://github.com/Wei-Shaw/sub2api.git'
          git fetch --quiet upstream --tags
          UPSTREAM_BASE="$(git merge-base HEAD upstream/main 2>/dev/null || true)"
          UPSTREAM_TAG=""
          if [ -n "$UPSTREAM_BASE" ]; then
            UPSTREAM_TAG="$(git describe --tags --match 'v*' --abbrev=0 "$UPSTREAM_BASE" 2>/dev/null || true)"
          fi
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::warning::無法由 upstream/main 推導上游版本，退回 backend/cmd/server/VERSION"
            UPSTREAM_TAG="v$(tr -d ' \n\r' < backend/cmd/server/VERSION)"
          fi
          # <<< 上游版本推導結束 >>>
          PREV="$(git describe --tags --abbrev=0 --match '[0-9]*' "${TAG}^" 2>/dev/null || true)"

          {
            echo "基於上游 Sub2API ${UPSTREAM_TAG}（https://github.com/Wei-Shaw/sub2api/releases/tag/${UPSTREAM_TAG}）"
            echo
            echo "## 映像"
            echo "\`${IMAGE}:${IMAGE_TAG}\`"
            if [ "$STABLE" = "true" ]; then
              echo '正式版本，同時更新 `latest`。'
            fi
            echo
            if [ -n "$PREV" ]; then
              echo "## 變更（自 ${PREV}）"
              git log --first-parent --pretty='- %s (%h)' "${PREV}..${TAG}"
            else
              echo "## 變更（自 初始）"
              git log --first-parent --pretty='- %s (%h)' -n 50 "$TAG"
            fi
          } > notes.md

          ARGS=(--prerelease="$PRERELEASE")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md "${ARGS[@]}"
          else
            gh release create "$TAG" --title "TapModels v${VERSION}" --notes-file notes.md "${ARGS[@]}"
          fi
