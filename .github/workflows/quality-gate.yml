name: Quality gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-deployment:
    name: API deployment contracts (no image build or containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest deploy.tests.test_runtime_permissions deploy.tests.test_api_compose -v
      - run: sh deploy/tests/docker-runtime-resources-test.sh
      - run: sh deploy/test-caddyfile-cache.sh

  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go test -tags=unit ./...
      - run: go vet -tags=unit ./...
      - run: go test -race -tags=unit ./internal/service ./internal/handler ./internal/repository ./internal/server -run 'UsageBillingEvent|UsageBillingPending|UsageBillingRecoveryFactory|UsagePricing|UsageSettlement|UsageRecord|UsageFieldsSnapshot|RequestBodyDeadline|BillingErrorDetails' -count=1 -timeout=5m
      - run: go test -tags=integration ./internal/repository -run 'TestUsageBillingRecovery|TestUsageCursor|TestUserPlatformQuotaRepository' -count=1 -timeout=10m

  frontend:
    name: Frontend type, lint, tests and generated locales
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix ../tools/zh-tw --omit=dev
      - run: pnpm audit --prod --audit-level=moderate --registry=https://registry.npmjs.org
      - run: pnpm typecheck
      - run: pnpm lint:check
      - run: pnpm test:run
      - run: node ../tools/zh-tw/gen-locale.mjs --check

  generated-downloads:
    name: Generated downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_docs_downloads.py --check
