name: Manual versioned release

run-name: NewAPI manual binary release · ${{ inputs.version || github.ref_name }}

# Reuse the workflow path registered on the default branch. Dispatch with
# --ref NewAPI to run THIS branch's implementation without changing main.
# Pushes only run quality-gate.yml; publishing is always manual.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version shown in the artifact name and release notes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: newapi-binary-release
  cancel-in-progress: false

jobs:
  build-binaries:
    name: build-binaries (linux, amd64)
    if: github.repository == 'holeenlu/sub2api' && github.ref == 'refs/heads/NewAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ github.sha }}
      LATEST_TAG: NewAPI/latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout selected NewAPI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Validate release input
        run: |
          case "$VERSION" in
            ''|*[!0-9A-Za-z._-]*)
              echo 'version must contain only letters, numbers, dot, underscore and hyphen' >&2
              exit 1
              ;;
          esac
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run release contract tests
        working-directory: backend
        run: >-
          go test -mod=readonly -tags=unit -count=1 -timeout=180s
          ./internal/service ./internal/repository ./internal/handler ./internal/server/routes
          -run 'Test(ModelManagement|AccountModelReferences|ManagedModel|ModelPolicy|ModelPricing|NativeHTTPFixture|VendorAdminProbe|AdminAuthorization|Route.*Model)'

      - name: Build linux amd64 binary
        working-directory: backend
        run: |
          mkdir -p ../dist
          go build -mod=readonly -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.Date=$DATE -X main.BuildType=source" \
            -o ../dist/sub2api \
            ./cmd/server

      - name: Package and checksum binary
        run: |
          mkdir -p dist/package
          cp dist/sub2api dist/package/sub2api
          cp LICENSE dist/package/LICENSE
          cp -R backend/resources dist/package/resources
          tar -C dist/package -czf "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" sub2api LICENSE resources
          (cd dist && sha256sum "NewAPI-${VERSION}-linux-amd64.tar.gz" > "NewAPI-${VERSION}-linux-amd64.tar.gz.sha256")
          file dist/sub2api
          sha256sum "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" "dist/NewAPI-${VERSION}-linux-amd64.tar.gz.sha256"

      - name: Publish only the latest moving release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="NewAPI ${VERSION}"
          notes_file="$RUNNER_TEMP/newapi-release-notes.md"
          cat > "$notes_file" <<EOF
          NewAPI ${VERSION}

          Source commit: ${COMMIT}
          Target: linux/amd64

          This release contains the NewAPI backend binary and pricing resources only.
          The frontend is deployed separately. No container images are published.
          EOF

          if gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Upload both verified assets before moving the existing tag.
            gh release upload "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz.sha256" \
              --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$LATEST_TAG" \
              -f sha="$COMMIT" -F force=true > /dev/null
            gh release edit "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes_file" \
              --latest=false
          else
            # Check repository access instead of treating an API outage as absence.
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" > /dev/null
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$LATEST_TAG" \
              --jq '.[] | select(.ref == "refs/tags/NewAPI/latest") | .object.sha')
            if [ -n "$tag_sha" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$LATEST_TAG" \
                -f sha="$COMMIT" -F force=true > /dev/null
            fi
            gh release create "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" \
              --title "$title" \
              --notes-file "$notes_file" \
              --latest=false \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz.sha256"
          fi

          # Keep only this version's assets on the NewAPI release. Other channels
          # and their historical releases/tags are outside this workflow's scope.
          assets=$(gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          while IFS= read -r asset; do
            case "$asset" in
              "NewAPI-${VERSION}-linux-amd64.tar.gz"|"NewAPI-${VERSION}-linux-amd64.tar.gz.sha256"|'') ;;
              NewAPI-*-linux-amd64.tar.gz|NewAPI-*-linux-amd64.tar.gz.sha256)
                gh release delete-asset "$LATEST_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done <<< "$assets"
