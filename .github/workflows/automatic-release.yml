name: Manual versioned release
run-name: NewAPI complete release · ${{ inputs.version || github.ref_name }}
# Use the registered workflow path, selected from NewAPI. Publishing stays manual.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Complete release version (API, main site and supplier portal)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: newapi-complete-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'holeenlu/sub2api' && github.ref == 'refs/heads/NewAPI'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify deployment and release contracts
        run: python3 -B -m unittest deploy.tests.test_runtime_permissions deploy.tests.test_api_compose deploy.tests.test_complete_release -v
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          from deploy.release.release import metadata
          version, commit = metadata()
          print('version=' + version)
          print('commit=' + commit)
          print('date=' + datetime.now(timezone.utc).isoformat())
          PY

  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Check once and build both frontend roles
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm run check:i18n
          pnpm exec vue-tsc -b
          VITE_API_BASE_URL=/api/v1 pnpm exec vite build --outDir dist
          VITE_API_BASE_URL=/api/v1 VITE_VENDOR_PORTAL=true pnpm exec vite build --outDir dist-vendor
          mkdir -p ../dist/ui
          mv dist ../dist/ui/main
          mv dist-vendor ../dist/ui/vendor
      - uses: actions/upload-artifact@v7
        with:
          name: newapi-frontend
          path: dist/ui
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

  build-binaries:
    needs: prepare
    name: build-binaries (linux, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: newapi-release-go-${{ runner.os }}-amd64-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ needs.prepare.outputs.commit }}
          restore-keys: |
            newapi-release-go-${{ runner.os }}-amd64-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            newapi-release-go-${{ runner.os }}-amd64-
      - name: Run release contract tests
        working-directory: backend
        run: >-
          go test -mod=readonly -tags=unit -count=1 -timeout=180s
          ./internal/service ./internal/repository ./internal/handler ./internal/server/routes
          -run 'Test(ModelManagement|AccountModelReferences|ManagedModel|ModelPolicy|ModelPricing|NativeHTTPFixture|VendorAdminProbe|AdminAuthorization|Route.*Model)'
      - name: Build binary once and collect resources
        working-directory: backend
        run: |
          mkdir -p ../dist/api
          go build -mod=readonly -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.Date=$DATE -X main.BuildType=release" \
            -o ../dist/api/sub2api ./cmd/server
          cp -R resources ../dist/api/resources
          cp ../LICENSE ../dist/api/LICENSE
          ../dist/api/sub2api --version
      - uses: actions/upload-artifact@v7
        with:
          name: newapi-backend
          path: dist/api
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

  publish:
    needs: [prepare, build-frontend, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          name: newapi-backend
          path: dist/api
      - uses: actions/download-artifact@v8
        with:
          name: newapi-frontend
          path: dist/ui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Package existing artifacts into three runtime images
        run: |
          set -euo pipefail
          chmod 755 dist/api/sub2api
          revision="sha-$COMMIT"
          ui_source_sha256=$(git archive "$COMMIT" frontend docs/legal backend/internal/pkg/claude/prompts/catalog.json backend/internal/service/scheduling_quota_defaults.json deploy/web deploy/vendor-portal LICENSE | sha256sum | cut -d' ' -f1)
          docker buildx build --platform linux/amd64 --target release --build-context release-artifacts=./dist/api \
            --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$COMMIT" \
            --load -t "ghcr.io/holeenlu/newapi-api:$revision" . &
          api_pid=$!
          for role in web vendor; do
            target=release-main
            [ "$role" = vendor ] && target=release-vendor
            docker buildx build --platform linux/amd64 -f deploy/web/Dockerfile --target "$target" \
              --build-context release-artifacts=./dist/ui --build-arg "VERSION=$VERSION" --build-arg "COMMIT=$COMMIT" \
              --build-arg "SOURCE_SHA256=$ui_source_sha256" --load -t "ghcr.io/holeenlu/newapi-$role:$revision" .
          done
          wait "$api_pid"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          images = {r: 'ghcr.io/holeenlu/newapi-' + r + ':sha-' + os.environ['COMMIT'] for r in ('api','web','vendor')}
          Path('dist/images.json').write_text(json.dumps(images))
          PY
      - name: Verify five-service deployment and restart persistence
        run: python3 -B deploy/release/release.py smoke
      - name: Verify actual WebSocket and SSE proxy transport
        env:
          WEB_TEST_IMAGE: ghcr.io/holeenlu/newapi-web:sha-${{ needs.prepare.outputs.commit }}
          VENDOR_PORTAL_TEST_IMAGE: ghcr.io/holeenlu/newapi-vendor:sha-${{ needs.prepare.outputs.commit }}
        run: python3 -B -m unittest deploy.tests.test_vendor_portal_image -v
      - id: images
        name: Push verified images and resolve immutable digests
        run: |
          set -euo pipefail
          for role in api web vendor; do
            image="ghcr.io/holeenlu/newapi-$role:sha-$COMMIT"
            test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            for attempt in 1 2 3; do
              if docker push "$image"; then break; fi
              [ "$attempt" = 3 ] && exit 1
              sleep "$((attempt * 5))"
            done
          done
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          from pathlib import Path
          images={}
          for role in ('api','web','vendor'):
              name='ghcr.io/holeenlu/newapi-'+role
              value=json.loads(subprocess.check_output(['docker','buildx','imagetools','inspect',name+':sha-'+os.environ['COMMIT'],'--format','{{json .Manifest}}'],text=True))
              images[role]=name+'@'+value['digest']
          Path('dist/images.json').write_text(json.dumps(images))
          print('images='+json.dumps(images,separators=(',',':')))
          PY
      - name: Create complete deployment bundle and publish verified assets
        run: |
          python3 -B deploy/release/release.py bundle
          python3 -B deploy/release/release.py publish

  promote:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote all three verified image digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGES: ${{ needs.publish.outputs.images }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          images=json.loads(os.environ['IMAGES'])
          for image in images.values():
              subprocess.run(['docker','buildx','imagetools','inspect',image],check=True,stdout=subprocess.DEVNULL)
          for image in images.values():
              name=image.split('@')[0]
              subprocess.run(['docker','buildx','imagetools','create','--prefer-index=false','--tag',name+':'+os.environ['VERSION'],'--tag',name+':latest',image],check=True)
              expected=image.split('@')[1]
              for tag in (os.environ['VERSION'],'latest'):
                  manifest=json.loads(subprocess.check_output(['docker','buildx','imagetools','inspect',name+':'+tag,'--format','{{json .Manifest}}'],text=True))
                  assert manifest['digest']==expected, name+':'+tag
          PY
