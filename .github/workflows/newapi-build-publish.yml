name: NewAPI Build binaries

run-name: NewAPI manual binary release · ${{ inputs.version || github.ref_name }}

# A push to NewAPI only runs quality-gate.yml. Binary compilation and release
# are deliberately manual so source pushes never publish an artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version shown in the artifact name and release notes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: newapi-binary-release
  cancel-in-progress: false

jobs:
  build-binaries:
    name: build-binaries (linux, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ github.sha }}
      DATE: ${{ github.run_started_at }}
      LATEST_TAG: NewAPI/latest
    steps:
      - name: Checkout selected NewAPI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Validate release input
        run: |
          case "$VERSION" in
            ''|*[!0-9A-Za-z._-]*)
              echo 'version must contain only letters, numbers, dot, underscore and hyphen' >&2
              exit 1
              ;;
          esac

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run release contract tests
        working-directory: backend
        run: >-
          go test -mod=readonly -tags=unit -count=1 -p=1 -timeout=180s
          ./internal/service ./internal/repository ./internal/handler ./internal/server/routes
          -run 'Test(ModelManagement|AccountModelReferences|ManagedModel|ModelPolicy|ModelPricing|NativeHTTPFixture|VendorAdminProbe|AdminAuthorization|Route.*Model)'

      - name: Build linux amd64 binary
        working-directory: backend
        run: |
          mkdir -p ../dist
          go build -mod=readonly -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.Date=$DATE -X main.BuildType=source" \
            -o ../dist/sub2api \
            ./cmd/server

      - name: Package and checksum binary
        run: |
          mkdir -p dist/package
          cp dist/sub2api dist/package/sub2api
          cp LICENSE dist/package/LICENSE
          tar -C dist/package -czf "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" sub2api LICENSE
          sha256sum "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" > "dist/NewAPI-${VERSION}-linux-amd64.tar.gz.sha256"
          file dist/sub2api
          sha256sum "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" "dist/NewAPI-${VERSION}-linux-amd64.tar.gz.sha256"

      - name: Publish only the latest moving release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="NewAPI ${VERSION}"
          notes_file="$RUNNER_TEMP/newapi-release-notes.md"
          cat > "$notes_file" <<EOF
          NewAPI ${VERSION}

          Source commit: ${COMMIT}
          Target: linux/amd64

          This release contains the NewAPI backend binary only.
          EOF

          if gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" \
              --title "$title" \
              --notes-file "$notes_file"
            gh release upload "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz.sha256" \
              --clobber
          else
            gh release create "$LATEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" \
              --title "$title" \
              --notes-file "$notes_file" \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz" \
              "dist/NewAPI-${VERSION}-linux-amd64.tar.gz.sha256"
          fi
